  <!-- ───────────── definição técnica ─────────────
       A Central do Cliente. Os ambientes vêm do contrato; para
       cada um, o cliente resolve as definições técnicas por
       assunto, e o que ele marca vira o pré-projeto.

       Duas coisas que a tela assume e diz em voz alta:
       · nada é global — a mesma obra tem piso aquecido num
         ambiente e não tem no outro;
       · transição é lista, não campo — um ambiente encosta em
         vários outros e cada encontro se resolve sozinho.

       Nesta versão não há servidor: as escolhas ficam no
       navegador. Onde o sistema gravaria ou emitiria documento,
       a tela mostra o conteúdo e declara o que faria.
       ───────────────────────────────────────────── -->
  <section class="def wrap" id="def">
    <p class="migalha"><a href="index.html">Catálogo</a><span>/</span>Central do cliente</p>
    <h1 class="display" style="font-size:clamp(var(--text-h3),4.4vw,var(--text-h1));max-width:22ch">Cada ambiente decide o seu próprio piso.</h1>
    <p class="lead" style="color:var(--apagado);max-width:58ch;margin-top:var(--s-3);font-size:clamp(var(--text-body),1.5vw,var(--text-body-lg))">
      Os ambientes abaixo vieram do contrato. Escolha um e resolva as definições
      técnicas dele — estrutura, aquecimento, rodapé, recortes e cada transição
      com os vizinhos. O que for marcado aqui é o que a equipe de projetos executa.
    </p>

    <div id="definicao"></div>
  </section>
</main>
